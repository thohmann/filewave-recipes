Description: Liefert das signierte Jabra-Direct-Paket aus der dmg unverändert. Version (CFBundleVersion) aus der App im
  Teilpaket, wie com.github.rtrouton.pkg.jabradirect. Liegt im Ordner pkg (pkg_path), der vorher geleert wird; so liegt
  dort immer nur die aktuelle Version. DOWNLOAD_URL ist überschrieben, weil der Host im Download-Recipe
  (jabraxpressonlineprdstor) nicht mehr auflöst (23.11.2026). Die URL stammt von der Jabra-Direct-Seite.
Identifier: com.github.thohmann.pkg.JabraDirect
ParentRecipe: com.github.joshua-d-miller.download.jabradirect
MinimumVersion: 2.3.0
Input:
  NAME: Jabra Direct
  DOWNLOAD_URL: https://jabraxpressonlineprod.blob.core.windows.net/jdo/JabraDirectSetup.dmg
Process:
- Processor: FlatPkgUnpacker
  Arguments:
    flat_pkg_path: '%pathname%/JabraDirectSetup.pkg'
    destination_path: '%RECIPE_CACHE_DIR%/unpack'
    purge_destination: true
- Processor: FileFinder
  Arguments:
    pattern: '%RECIPE_CACHE_DIR%/unpack/*JabraDirect*.pkg'
- Processor: PkgPayloadUnpacker
  Arguments:
    pkg_payload_path: '%found_filename%/Payload'
    destination_path: '%RECIPE_CACHE_DIR%/payload'
    purge_destination: true
- Processor: Versioner
  Arguments:
    input_plist_path: '%RECIPE_CACHE_DIR%/payload/Contents/Info.plist'
    plist_version_key: CFBundleVersion
- Processor: PkgRootCreator
  Comment: Leert den Ordner pkg (legt ihn neu an), damit nur das aktuelle Paket darin liegt.
  Arguments:
    pkgroot: '%RECIPE_CACHE_DIR%/pkg'
    pkgdirs: {}
- Processor: PkgCopier
  Arguments:
    source_pkg: '%pathname%/JabraDirectSetup.pkg'
    pkg_path: '%RECIPE_CACHE_DIR%/pkg/%NAME%-%version%.pkg'
- Processor: PathDeleter
  Arguments:
    path_list:
    - '%RECIPE_CACHE_DIR%/unpack'
    - '%RECIPE_CACHE_DIR%/payload'
