Description: Downloads latest Frontify release

Identifier: com.github.thohmann.download.Frontify
MinimumVersion: "2.3"

Input:
  NAME: Frontify
  GITHUB_REPO: Frontify/frontify-companion-release

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      github_repo: "%GITHUB_REPO%"
      asset_regex: ".*\\.dmg"

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%.dmg"
      url: "%url%"