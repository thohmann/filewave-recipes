Description: Lädt Adobe InDesign 2027 über das Parent-Recipe herunter und pflegt ein Installation-Fileset sowie ein Update-Fileset (klassischer Modus, neues Fileset pro Version). Jedes Paar aus FileWaveImporter/FileWaveScriptImporter steht direkt hintereinander, damit fw_fileset_id nicht zwischen den beiden Zielen vertauscht wird. Das Platzhalter-Fileset mit Custom Property autopkg_dependency_bundle_id=com.adobe.InDesign.2027.Installation legt das Recipe einmalig an (Uninstall-Skript, Kiosk-Angaben) und fasst es danach nicht mehr an; die Release-Pipeline (filewave-release) hängt dessen Dependency um. Die Release-Pipeline (filewave-release) verteilt das Update nach Ringen. Dieses Recipe baut nur.
Identifier: com.github.thohmann.filewave.AdobeInDesign2027
ParentRecipe: com.github.thohmann.pkg.AdobeAdminConsolePackage
MinimumVersion: 1.0.0
Input:
  NAME: Adobe InDesign 2027
  APP_NAME: Adobe InDesign 2027/Adobe InDesign 2027
  APP_BUNDLE_ID: com.adobe.InDesign
  APP_EDITION: '2027'
  ACTION_IF_RUNNING: skip
  KIOSK_DESCRIPTION: ''
Process:
- Processor: com.github.thohmann.processors/FileWaveImporter
  Arguments:
    fw_fileset_type: Installation
    fw_import_source: '%pkg_path%'
    fw_fileset_name: '%NAME% %fw_fileset_type% %version% (PKG)'
    fw_app_bundle_id: '%APP_BUNDLE_ID%.%APP_EDITION%.%fw_fileset_type%'
    fw_app_version: '%version%'
    fw_create_revision: false
- Processor: com.github.thohmann.processors/FileWaveScriptImporter
  Arguments:
    fw_scripts:
    - template: install_update_requirement
      script_type: requirementScripts
      variables:
        APP_NAME: '%APP_NAME%'
        REQUIRED_VERSION: ''
        MODE: '%fw_fileset_type%'
- Processor: com.github.thohmann.processors/FileWaveImporter
  Arguments:
    fw_fileset_type: Update
    fw_import_source: '%pkg_path%'
    fw_fileset_name: '%NAME% %fw_fileset_type% %version% (PKG)'
    fw_app_bundle_id: '%APP_BUNDLE_ID%.%APP_EDITION%.%fw_fileset_type%'
    fw_app_version: '%version%'
    fw_create_revision: false
    fw_revision_name: null
    fw_set_revision_as_default: false
- Processor: com.github.thohmann.processors/FileWaveScriptImporter
  Arguments:
    fw_scripts:
    - template: app_running_check
      script_type: preflightScripts
      variables:
        APP_NAME: '%APP_NAME%'
        APP_BUNDLE_ID: '%APP_BUNDLE_ID%'
        ACTION_IF_RUNNING: '%ACTION_IF_RUNNING%'
    - template: install_update_requirement
      script_type: requirementScripts
      variables:
        APP_NAME: '%APP_NAME%'
        REQUIRED_VERSION: '%version%'
        MODE: '%fw_fileset_type%'
- Processor: com.github.thohmann.processors/FileWavePlaceholderImporter
  Arguments:
    fw_placeholder_name: '%NAME% (App)'
    fw_dependency_bundle_id: '%APP_BUNDLE_ID%.%APP_EDITION%.Installation'
    fw_icon_path: '%adobe_icon_path%'
- Processor: com.github.thohmann.processors/FileWaveScriptImporter
  Arguments:
    fw_scripts:
    - template: adobe_uninstall
      script_type: postUninstallationScripts
      variables:
        ADOBE_SAP_CODE: '%adobe_sap_code%'
        ADOBE_BASE_VERSION: '%adobe_base_version%'
        ADOBE_PLATFORM: '%adobe_platform%'
- Processor: com.github.thohmann.processors/FileWaveKioskImporter
  Arguments:
    fileset_id: '%fw_fileset_id%'
    kiosk_title: '%NAME%'
    kiosk_description: '%KIOSK_DESCRIPTION%'
- Processor: com.github.thohmann.processors/AdobePackageArchiver
